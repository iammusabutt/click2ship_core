{% extends "click2ship_core/templates/layout.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="text-center">Create Your Account</h3>
                </div>
                <div class="card-body">
                    <form id="signup-form" onsubmit="return false;">
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="first_name">First Name</label>
                            <input type="text" class="form-control" id="first_name" name="first_name" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="last_name">Last Name</label>
                            <input type="text" class="form-control" id="last_name" name="last_name" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="confirm_password">Confirm Password</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                        </div>
                        
                        <div class="form-group form-check">
                            <input type="checkbox" class="form-check-input" id="terms" required>
                            <label class="form-check-label" for="terms">
                                I agree to the Terms of Service
                            </label>
                        </div>
                        
                        <button type="button" class="btn btn-primary btn-block" id="signup-btn">
                            Create Account
                        </button>
                    </form>
                    
                    <div class="mt-3 text-center">
                        <p>Already have an account? <a href="/login">Sign In</a></p>
                    </div>
                    
                    <div id="message" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}
<script>
// Get elements
const signupBtn = document.getElementById('signup-btn');
const messageDiv = document.getElementById('message');

// Add click event directly
signupBtn.onclick = function() {
    
    // Get form values
    const email = document.getElementById('email').value;
    const first_name = document.getElementById('first_name').value;
    const last_name = document.getElementById('last_name').value;
    const password = document.getElementById('password').value;
    const confirm_password = document.getElementById('confirm_password').value;
    const terms = document.getElementById('terms').checked;
    
    console.log('Form values:', {email, first_name, last_name, terms});
    
    // Basic validation
    if (!email || !first_name || !last_name || !password || !confirm_password) {
        showMessage('Please fill in all fields', 'error');
        return;
    }
    
    if (password !== confirm_password) {
        showMessage('Passwords do not match!', 'error');
        return;
    }
    
    if (password.length < 6) {
        showMessage('Password must be at least 6 characters long!', 'error');
        return;
    }
    
    if (!terms) {
        showMessage('Please agree to the Terms of Service', 'error');
        return;
    }
    
    // Disable button and show loading
    signupBtn.disabled = true;
    signupBtn.textContent = 'Creating Account...';
    showMessage('Creating your account...', 'info');
    
    // Make API call
    fetch('/api/method/click2ship_core.click2ship_core.controllers.signup.signup_user', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            email: email,
            first_name: first_name,
            last_name: last_name,
            password: password
        })
    })
    .then(response => {
        console.log('Response status:', response.status);
        return response.json();
    })
    .then(data => {
        console.log('Response data:', data);
        
        if (data.message && data.message.includes('successfully')) {
            showMessage('Account created successfully! Redirecting to login...', 'success');
            setTimeout(() => {
                window.location.href = '/login';
            }, 2000);
        } else {
            let errorMessage = 'An error occurred. Please try again.';
            
            if (data._server_messages) {
                try {
                    const messages = JSON.parse(data._server_messages);
                    if (messages && messages.length > 0) {
                        errorMessage = messages[0].replace(/^Error:\s*/, '');
                    }
                } catch (e) {
                    console.error('Error parsing messages:', e);
                }
            } else if (data.message) {
                errorMessage = data.message;
            } else if (data.exc) {
                errorMessage = 'Server error occurred.';
            }
            
            showMessage(errorMessage, 'error');
        }
    })
    .catch(error => {
        console.error('Fetch error:', error);
        showMessage('Network error. Please try again.', 'error');
    })
    .finally(() => {
        signupBtn.disabled = false;
        signupBtn.textContent = 'Create Account';
    });
};

function showMessage(message, type) {
    const alertClass = type === 'success' ? 'alert-success' : 
                      type === 'error' ? 'alert-danger' : 'alert-info';
    messageDiv.innerHTML = `<div class="alert ${alertClass}">${message}</div>`;
}

// Test if jQuery is available (for debugging)
if (typeof jQuery !== 'undefined') {
    console.log('jQuery is available');
} else {
    console.log('jQuery is NOT available');
}

// Test if frappe is available
if (typeof frappe !== 'undefined') {
    console.log('Frappe is available');
} else {
    console.log('Frappe is NOT available');
}
</script>
{% endblock %}
