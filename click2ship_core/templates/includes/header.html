    <!-- Login Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="loginModalLabel">Login</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="login-form">
                        <div class="form-group mb-4">
                            <div class="form-floating">
                                <input type="email" class="form-control" id="login-email" placeholder="Email address" required>
                                <label for="login-email">Email address</label>
                            </div>
                        </div>
                        <div class="form-group mb-4">
                            <div class="form-floating">
                                <input type="password" class="form-control" id="login-password" placeholder="Password" required>
                                <label for="login-password">Password</label>
                            </div>
                        </div>
                        <div id="login-error" class="text-danger mb-3"></div>
                        <button type="submit" class="btn btn-red">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const loginForm = document.getElementById("login-form");
            if(loginForm) {
                loginForm.addEventListener("submit", function(event) {
                    event.preventDefault();
                    const email = document.getElementById("login-email").value;
                    const password = document.getElementById("login-password").value;
                    const loginError = document.getElementById("login-error");

                    // Clear previous errors
                    loginError.textContent = "";

                    fetch("/api/method/login", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/x-www-form-urlencoded"
                        },
                        body: `usr=${encodeURIComponent(email)}&pwd=${encodeURIComponent(password)}`
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.message === "Logged In") {
                            window.location.href = "/dashboard"; // Redirect to dashboard page
                        } else {
                            // Frappe login API returns an error message in data.message on failure
                            loginError.textContent = data.message || "Invalid username or password.";
                        }
                    })
                    .catch(err => {
                        console.error("Login error:", err);
                        loginError.textContent = "An error occurred during login.";
                    });
                });
            }
        });
    </script>
